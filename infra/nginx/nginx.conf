# Nginx config — public domain: p14.sumzip.com
# 컨테이너 내부에서: frontend:9514 / backend:9534 로 프록시

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript;
  gzip_min_length 1024;

  # security headers (TLS 종단 측에서 일관 적용)
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  upstream backend_upstream {
    server backend:9534;
  }

  upstream frontend_upstream {
    server frontend:9514;
  }

  # HTTP → HTTPS 리다이렉트 (프로덕션)
  server {
    listen 80;
    server_name p14.sumzip.com;
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name p14.sumzip.com;

    # TLS 인증서 마운트 위치 — infra/nginx/tls/
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 2m;

    # /api → backend (9534)
    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 60s;
    }

    # /health → backend (모니터링용)
    location /health {
      proxy_pass http://backend_upstream;
    }

    # 그 외 → frontend (Vue SPA)
    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
